version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/tools/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
