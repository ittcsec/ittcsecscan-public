# Scheduled and merge-time checks that are too costly to run on every pull
# request. macOS runners bill at 10x, so the macOS race detector runs here —
# nightly, on merge to main, and on demand — instead of on every push. The
# every-PR matrix keeps macOS unit tests (which exercise the one
# macOS-specific behaviour, fsperm's "unknown" ACL result) and the Linux and
# Windows race detectors. See ci.yml.
name: scheduled

on:
  schedule:
    - cron: "23 5 * * *" # nightly, 05:23 UTC; off the top of the hour
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.2"
  GOTOOLCHAIN: local
  # The product module is vendored (ADR-0017): tests build from vendor/.
  GOFLAGS: -mod=vendor

jobs:
  race-macos:
    name: race detector (macos-15)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Tests with -race
        run: go test -race -count=1 ./...
